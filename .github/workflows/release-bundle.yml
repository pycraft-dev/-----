# Сборка подписанного AAB для Google Play / MDM (см. docs/КОРПОРАТИВНЫЙ_РЕЛИЗ_CI.md)
name: Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK components (compileSdk 36)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Gradle (кэш зависимостей)
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore из секрета
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::error::В GitHub → Settings → Secrets добавьте RELEASE_KEYSTORE_BASE64 (см. docs/КОРПОРАТИВНЫЙ_РЕЛИЗ_CI.md)"
            exit 1
          fi
          echo "$B64" | base64 -d > release-keystore.jks

      - name: Сборка bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Артефакт AAB
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-enterprise-aab
          path: app/build/outputs/bundle/release/*.aab
