# Сборка подписанного AAB + APK (см. docs/КОРПОРАТИВНЫЙ_РЕЛИЗ_CI.md)
name: Release AAB + APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK components (compileSdk 36)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Gradle (кэш зависимостей)
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore из секрета
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::error::В GitHub → Settings → Secrets добавьте RELEASE_KEYSTORE_BASE64 (см. docs/КОРПОРАТИВНЫЙ_РЕЛИЗ_CI.md)"
            exit 1
          fi
          echo "$B64" | base64 -d > release-keystore.jks

      - name: Сборка bundleRelease + assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Опционально: URL update.json внутри собранного APK (иначе пусто = заглушка в модуле :update).
          UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Артефакт AAB
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-enterprise-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-enterprise-apk
          path: app/build/outputs/apk/release/*.apk

      # При ручном запуске (workflow_dispatch) релиз не создаётся — только Artifacts.
      # При push тега v*: релиз + update.json (versionCode из APK) → клиенты с UPDATE_MANIFEST_URL на
      # https://github.com/<owner>/<repo>/releases/latest/download/update.json получают обновление без смены URL.
      - name: GitHub Release + update.json (только при push тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          VC=$("$AAPT" dump badging "$APK" | head -1 | grep -oP "versionCode='\K\d+")
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk"
          jq -n \
            --argjson vc "$VC" \
            --arg apk "$APK_URL" \
            --arg notes "Релиз ${TAG}." \
            '{versionCode: $vc, apkUrl: $apk, releaseNotes: $notes}' > update.json
          echo "Generated update.json:" && cat update.json
          if gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; then
            gh release upload "$TAG" "$AAB" "$APK" update.json --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$AAB" "$APK" update.json \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi
